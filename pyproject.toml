[project]
name = "qoblib-pulser-feasibility"
version = "0.1.0"
description = "Eight-atom Pulser feasibility benchmark for QOBLIB Steiner repairs"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.5,<2.6",
    "pulser>=1.9,<2",
    "pulser-simulation>=1.9,<2",
    "scipy>=1.18,<1.19",
]

[dependency-groups]
test = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
